services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gestion
      POSTGRES_PASSWORD: gestion
      POSTGRES_DB: gestion
    # Puerto expuesto solo para desarrollo local; quitarlo en servidores públicos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://gestion:gestion@postgres:5432/gestion
      # Obligatorio: definir JWT_SECRET (mínimo 32 caracteres) en el entorno o en un archivo .env
      JWT_SECRET: ${JWT_SECRET:?Definí la variable JWT_SECRET (mínimo 32 caracteres)}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
